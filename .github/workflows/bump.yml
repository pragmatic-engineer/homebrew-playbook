name: bump

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Find the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo pragmatic-engineer/playbook --json tagName --jq .tagName)"
          latest="${tag#v}"
          current="$(sed -n 's#.*download/v\([0-9][0-9.]*\)/.*#\1#p' Formula/playbook.rb | head -n1)"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "Formula is current at ${current}."
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          else
            echo "Formula is at ${current}, latest release is ${latest}."
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the formula from the release checksums
        if: steps.release.outputs.outdated == 'true'
        env:
          VERSION: ${{ steps.release.outputs.latest }}
        run: .github/scripts/bump-formula.sh "$VERSION"

      - name: Set up Homebrew
        if: steps.release.outputs.outdated == 'true'
        uses: Homebrew/actions/setup-homebrew@9ffcbcc2c89631400988e8d4b1e3ac17dbbe3fe9 # main

      - name: Link the checkout as the tap
        if: steps.release.outputs.outdated == 'true'
        run: |
          tap_dir="$(brew --repository)/Library/Taps/pragmatic-engineer"
          mkdir -p "$tap_dir"
          rm -rf "$tap_dir/homebrew-tap"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir/homebrew-tap"
          test "$(realpath "$(brew --repository pragmatic-engineer/tap)")" = "$(realpath "$GITHUB_WORKSPACE")"

      - name: Verify the new formula
        if: steps.release.outputs.outdated == 'true'
        run: |
          brew audit --strict --online pragmatic-engineer/tap/playbook
          brew install --verbose pragmatic-engineer/tap/playbook
          brew test pragmatic-engineer/tap/playbook

      - name: Open, check and merge the bump pull request
        if: steps.release.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.latest }}
          FILE_PATH: Formula/playbook.rb
        run: |
          set -euo pipefail
          branch="bump/v${VERSION}"
          title="chore(deps): bump playbook to ${VERSION}"

          # Start clean if an earlier run left a branch or PR behind.
          if gh api "repos/${REPO}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${REPO}/git/refs/heads/${branch}"
          fi

          # GitHub signs commits made through createCommitOnBranch.
          head="$(gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)"
          gh api -X POST "repos/${REPO}/git/refs" -f "ref=refs/heads/${branch}" -f "sha=${head}" >/dev/null
          jq -n \
            --arg repo "$REPO" --arg branch "$branch" --arg head "$head" --arg msg "$title" \
            --arg path "$FILE_PATH" --arg content "$(base64 < "$FILE_PATH" | tr -d '\n')" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: $msg},
                expectedHeadOid: $head,
                fileChanges: {additions: [{path: $path, contents: $content}]}
              }}}' > "$RUNNER_TEMP/payload.json"
          oid="$(gh api graphql --input "$RUNNER_TEMP/payload.json" --jq '.data.createCommitOnBranch.commit.oid // empty')"
          if [ -z "$oid" ]; then
            echo "::error::the API did not create the commit. main may have moved since this run started. The next run retries." >&2
            exit 1
          fi
          echo "Created signed commit ${oid} on ${branch}."

          pr="$(gh api -X POST "repos/${REPO}/pulls" \
            -f "title=${title}" -f "head=${branch}" -f base=main \
            -f "body=Automated bump of the playbook pin to ${VERSION}, with URLs and checksums from the release SHA256SUMS. The full checks are dispatched on this branch and the pull request is squash merged once they pass." \
            --jq .number)"
          echo "Opened pull request #${pr}."

          # Events from GITHUB_TOKEN do not start push or pull_request workflows,
          # but workflow_dispatch is allowed, so start the real checks by hand.
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run tests.yml --repo "$REPO" --ref "$branch"
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --repo "$REPO" --workflow tests.yml --branch "$branch" --event workflow_dispatch \
              --json databaseId,createdAt --jq "map(select(.createdAt >= \"${started}\")) | first | .databaseId // empty")"
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "::error::the dispatched checks run did not appear." >&2
            exit 1
          fi
          echo "Checks run: https://github.com/${REPO}/actions/runs/${run_id}"
          gh run watch "$run_id" --repo "$REPO" --exit-status --interval 20

          # The checks ran on the branch head, so the required contexts are satisfied.
          # The ruleset can lag a few seconds behind the finished run and answer
          # 405, so retry the merge for a while before giving up.
          for attempt in $(seq 1 20); do
            if gh api -X PUT "repos/${REPO}/pulls/${pr}/merge" \
              -f merge_method=squash -f "commit_title=${title} (#${pr})" -f commit_message= >/dev/null; then
              echo "Merged pull request #${pr}."
              exit 0
            fi
            echo "Merge attempt ${attempt} was refused, retrying in 15s."
            sleep 15
          done
          echo "::error::the pull request could not be merged." >&2
          exit 1
