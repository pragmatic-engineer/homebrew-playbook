name: bump

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Find the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo pragmatic-engineer/playbook --json tagName --jq .tagName)"
          latest="${tag#v}"
          current="$(sed -n 's#.*download/v\([0-9][0-9.]*\)/.*#\1#p' Formula/playbook.rb | head -n1)"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "Formula is current at ${current}."
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          else
            echo "Formula is at ${current}, latest release is ${latest}."
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the formula from the release checksums
        if: steps.release.outputs.outdated == 'true'
        env:
          VERSION: ${{ steps.release.outputs.latest }}
        run: .github/scripts/bump-formula.sh "$VERSION"

      - name: Set up Homebrew
        if: steps.release.outputs.outdated == 'true'
        uses: Homebrew/actions/setup-homebrew@9ffcbcc2c89631400988e8d4b1e3ac17dbbe3fe9 # main

      - name: Link the checkout as the tap
        if: steps.release.outputs.outdated == 'true'
        run: |
          tap_dir="$(brew --repository)/Library/Taps/pragmatic-engineer"
          mkdir -p "$tap_dir"
          rm -rf "$tap_dir/homebrew-tap"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir/homebrew-tap"
          test "$(realpath "$(brew --repository pragmatic-engineer/tap)")" = "$(realpath "$GITHUB_WORKSPACE")"

      - name: Verify the new formula
        if: steps.release.outputs.outdated == 'true'
        run: |
          brew audit --strict --online pragmatic-engineer/tap/playbook
          brew install --verbose pragmatic-engineer/tap/playbook
          brew test pragmatic-engineer/tap/playbook

      - name: Commit the bump through the API so GitHub signs it
        if: steps.release.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.latest }}
          FILE_PATH: Formula/playbook.rb
        run: |
          set -euo pipefail
          head="$(gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)"
          jq -n \
            --arg repo "$REPO" --arg head "$head" --arg msg "playbook ${VERSION}" \
            --arg path "$FILE_PATH" --arg content "$(base64 < "$FILE_PATH" | tr -d '\n')" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: "main"},
                message: {headline: $msg},
                expectedHeadOid: $head,
                fileChanges: {additions: [{path: $path, contents: $content}]}
              }}}' > "$RUNNER_TEMP/payload.json"
          oid="$(gh api graphql --input "$RUNNER_TEMP/payload.json" --jq '.data.createCommitOnBranch.commit.oid // empty')"
          if [ -z "$oid" ]; then
            echo "::error::the API did not create the commit. main may have moved since this run started. The next run retries." >&2
            exit 1
          fi
          echo "Created signed commit ${oid}."
